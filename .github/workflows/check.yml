name: Проверка сборки
# Запускается на каждый pull request в main: собирает сайт так же, как публикация,
# но ничего не публикует и ничего не сохраняет. Зелёная галочка — можно сливать.
on:
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: "check-${{ github.ref }}", cancel-in-progress: true}
jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest
    env:
      FROM_NOTION: ${{ vars.CONTENT_SOURCE != 'github' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Проверка калькулятора
        run: |
          node --check docs/assets/js/engine.js
          node --check docs/assets/js/calc.js
          node --check docs/assets/js/glossary.js
          node --check docs/assets/js/layout-network.js
          node --check docs/assets/js/tables.js
          node --test tests/*.test.mjs
      - name: Выгрузка из Notion (как при публикации)
        if: env.FROM_NOTION == 'true'
        run: |
          npm install --no-audit --no-fund
          node scripts/sync.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_DB }}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Проверка данных оборудования после выгрузки
        if: env.FROM_NOTION == 'true'
        run: node tests/equipment.test.mjs
      - name: Сборка MkDocs
        run: pip install mkdocs-material && mkdocs build
      - name: Проверка workflow Pages
        run: |
          python - <<'PY'
          import yaml
          with open('.github/workflows/site.yml', encoding='utf-8') as f:
              workflow = yaml.safe_load(f)
          jobs = workflow['jobs']
          assert set(jobs) == {'build', 'deploy'}, 'нужны отдельные jobs build и deploy'
          assert jobs['deploy']['needs'] == 'build', 'deploy должен ждать build'
          assert workflow['concurrency']['cancel-in-progress'] is False, 'не отменять публикацию на полпути'
          build_steps = jobs['build']['steps']
          assert not any('deploy-pages' in str(step) for step in build_steps), 'deploy не должен быть в build'
          assert any('configure-pages@v6' in str(step) for step in build_steps), 'нужен configure-pages@v6'
          assert any('upload-pages-artifact@v5' in str(step) for step in build_steps), 'нужен upload-pages-artifact@v5'
          assert any('deploy-pages@v5' in str(step) for step in jobs['deploy']['steps']), 'нужен deploy-pages@v5'
          print('Workflow Pages: раздельные build/deploy, версии и permissions корректны')
          PY
      - name: Итог
        run: |
          test -f site/index.html
          echo "Страниц собрано: $(find site -name index.html | wc -l)"
