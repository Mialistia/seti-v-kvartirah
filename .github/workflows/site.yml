name: Сайт из Notion
# Источник текстов задаётся переменной репозитория CONTENT_SOURCE
# (Settings → Secrets and variables → Actions → Variables):
#   notion (или переменная не задана) — страницы берутся из Notion;
#   github — Notion не используется, сайт собирается из docs/*.md ветки main.
# Ветка main защищена (изменения только через pull request), поэтому снимок
# страниц из Notion сохраняется не в main, а в отдельную ветку notion-content.
on:
  schedule: [{cron: "0 * * * *"}]   # каждый час
  workflow_dispatch:                 # кнопка «Run workflow»
  push: {branches: [main]}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      FROM_NOTION: ${{ vars.CONTENT_SOURCE != 'github' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Выгрузка из Notion
        if: env.FROM_NOTION == 'true'
        run: |
          npm install --no-audit --no-fund
          node scripts/sync.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ secrets.NOTION_DB }}
      - name: Сохранить снимок страниц в ветку notion-content
        if: env.FROM_NOTION == 'true'
        run: |
          git config user.name "notion-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs mkdocs.yml
          if git diff --cached --quiet; then
            echo "Страницы не отличаются от main"
          else
            git commit -q -m "Синхронизация из Notion $(TZ=Asia/Yekaterinburg date '+%Y-%m-%d %H:%M')"
          fi
          # notion-content = текущий main + последний снимок Notion (перезаписывается каждый час)
          git push --force origin HEAD:refs/heads/notion-content
      - name: Проверка калькулятора
        run: |
          node --check docs/assets/js/engine.js
          node --check docs/assets/js/calc.js
          node --check docs/assets/js/glossary.js
          node --check docs/assets/js/plan.js
          node --check docs/assets/js/layout.js
          node --check docs/assets/js/layout-ui.js
          node --check docs/assets/js/layout-img.js
          node --check docs/assets/js/layout-tools.js
          node --check docs/assets/js/layout-network.js
          node --check docs/assets/js/tables.js
          node tests/engine.test.mjs
          node tests/calc.test.mjs
          node tests/equipment.test.mjs
          node tests/planner-network.test.mjs
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Сборка MkDocs
        run: |
          pip install mkdocs-material
          mkdocs build --strict
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v6
      - name: Загрузить артефакт Pages
        uses: actions/upload-pages-artifact@v5
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
