name: Резервная копия
# После каждого изменения main (слияние pull request), раз в неделю и по кнопке:
# тег backup-ГГГГ-ММ-ДД-ЧЧММ (время Екатеринбурга) и выпуск (Release) с архивами.
on:
  push: {branches: [main]}
  schedule: [{cron: "0 20 * * 0"}]   # понедельник 01:00 по Екатеринбургу
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: backup, cancel-in-progress: false}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Тег и выпуск с архивами
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="backup-$(TZ=Asia/Yekaterinburg date '+%Y-%m-%d-%H%M')"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then TAG="$TAG-${GITHUB_SHA::7}"; fi
          git archive --format=zip --prefix=seti-v-kvartirah/ -o "main_$TAG.zip" "$GITHUB_SHA"
          FILES="main_$TAG.zip"
          NOTE="Ветка main, коммит $GITHUB_SHA."
          if git ls-remote --exit-code --heads origin notion-content >/dev/null; then
            git fetch -q origin notion-content
            git archive --format=zip --prefix=seti-v-kvartirah/ -o "notion-content_$TAG.zip" FETCH_HEAD
            FILES="$FILES notion-content_$TAG.zip"
            NOTE="$NOTE Снимок страниц из Notion: ветка notion-content, коммит $(git rev-parse --short FETCH_HEAD)."
          fi
          gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest=false \
            --title "Резервная копия $TAG" \
            --notes "Автоматическая резервная копия (${{ github.event_name }}). $NOTE Откат: создайте ветку от этого тега или распакуйте архив."
          echo "Создан выпуск $TAG" >> "$GITHUB_STEP_SUMMARY"
